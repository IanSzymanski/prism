<section class="ca-cta-card-sect">
  <div class="ca-cta-card" data-cta-card="">

    <svg class="ca-cta-card__shape" data-cta-card-shape="" aria-hidden="true" preserveAspectRatio="none">
      <defs>
        <!-- Base ramp: near-black at the top, indigo at the bottom. Tilted
             slightly (x1 .18 → x2 0) so the left edge lifts before the
             right, which keeps the field from reading as a flat backdrop. -->
        <linearGradient id="ca-cta-card-fill" x1="0.18" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#130726"></stop>
          <stop offset="0.30" stop-color="#221045"></stop>
          <stop offset="0.68" stop-color="#301669"></stop>
          <stop offset="1" stop-color="#3E1F8E"></stop>
        </linearGradient>

        <!-- Warm pass. A single linear ramp cannot put near-black at the top
             and BOTH indigo bottom-left and violet bottom-right; this is
             what bends one corner toward magenta while the other stays
             blue. Anchored past the corner (cx .9, cy 1.06) so the brightest
             point sits outside the card and only its falloff is visible. -->
        <radialGradient id="ca-cta-card-warm" cx="0.9" cy="1.06" r="0.86">
          <stop offset="0" stop-color="#A21CE0" stop-opacity="0.66"></stop>
          <stop offset="0.42" stop-color="#7B10C0" stop-opacity="0.30"></stop>
          <stop offset="1" stop-color="#7B10C0" stop-opacity="0"></stop>
        </radialGradient>

        <!-- The pool. The gradient button sits at the card's centre, and a
             purple button on a purple field is the one place this palette
             loses contrast. Rather than muting the whole card until the
             button is safe, the darkness goes where the button is: bright
             at the corners, deep in the middle. Move `cy` if the button
             moves. -->
        <radialGradient id="ca-cta-card-pool" cx="0.5" cy="0.66" r="0.62">
          <stop offset="0" stop-color="#0C0417" stop-opacity="0.60"></stop>
          <stop offset="0.5" stop-color="#0C0417" stop-opacity="0.30"></stop>
          <stop offset="1" stop-color="#0C0417" stop-opacity="0"></stop>
        </radialGradient>
      </defs>

      <!-- All three share one `d`, written by the module every frame, so
           they clip to the card exactly and follow the edges as they move. -->
      <path data-cta-card-path="" fill="url(#ca-cta-card-fill)"></path>
      <path data-cta-card-warm="" fill="url(#ca-cta-card-warm)"></path>
      <path data-cta-card-pool="" fill="url(#ca-cta-card-pool)"></path>
    </svg>

    <div class="ca-cta-card__body" data-cta-card-body="">

      <h2>{{heading}}</h2>

      <p class="lede">{{lede}}</p>

      <div class="ca-cta-card__act">

        <a class="cta" href="{{primaryHref}}">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" aria-hidden="true" viewBox="0 0 256 256"><path d="M208,32H184V24a8,8,0,0,0-16,0v8H88V24a8,8,0,0,0-16,0v8H48A16,16,0,0,0,32,48V208a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V48A16,16,0,0,0,208,32ZM169.66,133.66l-48,48a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L116,164.69l42.34-42.35a8,8,0,0,1,11.32,11.32ZM48,80V48H72v8a8,8,0,0,0,16,0V48h80v8a8,8,0,0,0,16,0V48h24V80Z"></path></svg>
          <span>{{primaryLabel}}</span>
        </a>


        <a class="ghost" href="{{ghostHref}}">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" aria-hidden="true" viewBox="0 0 256 256"><path d="M243.6,148.8a6,6,0,0,1-8.4-1.2A53.58,53.58,0,0,0,192,126a6,6,0,0,1,0-12,26,26,0,1,0-25.18-32.5,6,6,0,0,1-11.62-3,38,38,0,1,1,59.91,39.63A65.69,65.69,0,0,1,244.8,140.4,6,6,0,0,1,243.6,148.8ZM189.19,213a6,6,0,0,1-2.19,8.2,5.9,5.9,0,0,1-3,.81,6,6,0,0,1-5.2-3,59,59,0,0,0-101.62,0,6,6,0,1,1-10.38-6A70.1,70.1,0,0,1,103,182.55a46,46,0,1,1,50.1,0A70.1,70.1,0,0,1,189.19,213ZM128,178a34,34,0,1,0-34-34A34,34,0,0,0,128,178ZM70,120a6,6,0,0,0-6-6A26,26,0,1,1,89.18,81.49a6,6,0,1,0,11.62-3,38,38,0,1,0-59.91,39.63A65.69,65.69,0,0,0,11.2,140.4a6,6,0,1,0,9.6,7.2A53.58,53.58,0,0,1,64,126,6,6,0,0,0,70,120Z"></path></svg>
          <span>{{ghostLabel}}</span>
        </a>
      </div>
    </div>

  </div>
</section>
