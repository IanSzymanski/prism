# Cuts a release: checks the tutorial, builds the plugin zip and attaches it to a GitHub release tagged v<version>.
# Run it by hand (Actions > Release > Run workflow) after the version is stamped and merged (tools/build.py <version>).
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as stamped in plugin/prism/skills/prism-produce/kit/VERSION (e.g. 1.0.0)"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version reaches the scripts only through env and must be a plain x.y.z, so no input can run as shell.
      - name: Check the version is stamped
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be x.y.z, not: $VERSION"; exit 1; }
          stamped="$(cat plugin/prism/skills/prism-produce/kit/VERSION)"
          [ "$stamped" = "$VERSION" ] || { echo "kit/VERSION says $stamped, not $VERSION: run tools/build.py $VERSION and merge first"; exit 1; }
      - name: Build the plugin zip
        env:
          VERSION: ${{ inputs.version }}
        run: python3 tools/build.py "$VERSION"
      - name: Nothing changed while building
        run: git diff --exit-code
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          # A version's own notes (.github/release-notes/<version>.md) go above the standing install notes.
          notes=.github/release-notes.md
          if [ -f ".github/release-notes/$VERSION.md" ]; then cat ".github/release-notes/$VERSION.md" .github/release-notes.md > /tmp/notes.md; notes=/tmp/notes.md; fi
          gh release create "v$VERSION" "dist/prism-$VERSION.zip" \
            --target "$SHA" --title "Prism $VERSION" --notes-file "$notes"
